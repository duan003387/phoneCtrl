name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 用 tauri-action 跨平台构建、签名更新包并创建 GitHub Release（含 latest.json 更新清单）
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: "--target aarch64-apple-darwin"
          - os: macos-14
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      # 生成内置离线 Appium 运行时（best-effort：失败也继续，运行时会回退全局/npx）
      - name: Prepare offline Appium runtime
        continue-on-error: true
        run: bash scripts/bundle-appium.sh

      # 用 Tauri 的 updater minisign 私钥签名更新产物（在仓库 Secrets 里配置）
      - name: Build & publish release (updater artifacts + latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          release: true
          # 上传更新产物并在 Release 里生成/合并 latest.json（供客户端 updater 拉取）
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: "PhoneCtrl v__VERSION__"
          releaseDraft: false
          prerelease: false
